name: Fetch NSE daily bars

on:
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30.
    - cron: "40 10 * * 1-5"   # 16:10 IST, Mon-Fri
    - cron: "05 11 * * 1-5"   # 16:35 IST, retry in case the 16:10 bar was late
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-nse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet yfinance pandas

      - name: Download
        run: python fetch_nse.py

      - name: Commit if changed
        run: |
          git config user.name  "sdz-bot"
          git config user.email "sdz-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change - nothing to commit"
          else
            git commit -m "data: $(cat data/LATEST.txt | head -1)"
            git push
          fi
