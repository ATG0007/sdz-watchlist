name: Fetch 20 years of history (one-off)
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - run: pip install yfinance pandas requests
 
      - name: Fetch 20 years
        run: python fetch_history.py
 
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hist/ data/LATEST_20Y.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "20-year history for the study"
            git push
          fi
